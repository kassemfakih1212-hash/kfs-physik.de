<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hogwarts Zeremonie - Der Sprechende Hut</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@500;700;800&display=swap');

    :root {
      --bg: radial-gradient(circle at 50% 25%, #231638 0%, #0c0816 65%, #050308 100%);
      --gold: #f5c842;
      --gold-dim: #c99e2a;
      --gryffindor: #e63946;
      --hufflepuff: #ffb703;
      --ravenclaw: #3a86ff;
      --slytherin: #2ec4b6;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: #ede3cb;
      font-family: 'Cinzel', serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 25px 15px;
    }

    h1 {
      font-family: 'Cinzel Decorative', cursive;
      color: var(--gold);
      font-size: 2.2rem;
      text-align: center;
      margin-bottom: 10px;
      text-shadow: 0 0 20px rgba(245, 200, 66, 0.4);
    }

    /* Audio Diagnostic Status Bar */
    .audio-status-panel {
      background: rgba(10, 7, 18, 0.85);
      border: 1px solid var(--gold-dim);
      border-radius: 8px;
      padding: 10px 16px;
      margin-bottom: 20px;
      font-size: 0.85rem;
      max-width: 1050px;
      width: 100%;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .status-items {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .status-tag {
      padding: 3px 8px;
      border-radius: 4px;
      background: rgba(255,255,255,0.06);
    }

    .tag-ok { color: #2ecc71; }
    .tag-missing { color: #ff6b6b; font-weight: bold; }

    .drop-btn {
      background: #2a2040;
      color: var(--gold);
      border: 1px dashed var(--gold);
      padding: 5px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.8rem;
    }
    .drop-btn:hover { background: #3d305c; }

    .container {
      display: grid;
      grid-template-columns: 1fr 1.15fr;
      gap: 20px;
      max-width: 1050px;
      width: 100%;
    }

    .card {
      background: rgba(22, 17, 36, 0.92);
      border: 2px solid var(--gold-dim);
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
    }

    label {
      display: block;
      color: var(--gold);
      font-weight: bold;
      margin-bottom: 6px;
    }

    textarea, input[type="text"] {
      width: 100%;
      background: rgba(10, 7, 18, 0.95);
      border: 1px solid #4a3b69;
      border-radius: 6px;
      color: #fff;
      font-family: 'Cinzel', serif;
      font-size: 0.95rem;
      padding: 10px;
      margin-bottom: 12px;
    }

    textarea { height: 130px; resize: vertical; }

    .btn {
      background: linear-gradient(135deg, #800000 0%, #4a0000 100%);
      color: var(--gold);
      border: 1.5px solid var(--gold);
      padding: 14px;
      font-size: 1.15rem;
      font-weight: 800;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
      letter-spacing: 1px;
      font-family: 'Cinzel', serif;
      transition: all 0.3s;
    }

    .btn:hover:not(:disabled) {
      background: linear-gradient(135deg, #b30000 0%, #6b0000 100%);
      box-shadow: 0 0 20px rgba(245, 200, 66, 0.5);
    }

    .btn:disabled {
      background: #2b2538;
      border-color: #554a6b;
      color: #796f8c;
      cursor: not-allowed;
    }

    .stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      min-height: 320px;
    }

    .hat-icon {
      font-size: 4.2rem;
      margin-bottom: 8px;
      transition: transform 0.3s;
    }

    .thinking .hat-icon {
      animation: wobble 0.8s infinite alternate ease-in-out;
    }

    @keyframes wobble {
      0% { transform: rotate(-8deg) scale(1.05); }
      100% { transform: rotate(8deg) scale(1.05); }
    }

    .student-name {
      font-size: 1.35rem;
      font-weight: bold;
      color: #fff;
      min-height: 1.8rem;
      margin-bottom: 8px;
    }

    .speech-bubble {
      font-style: italic;
      font-size: 1.05rem;
      color: #eeddbb;
      min-height: 4.5rem;
      line-height: 1.45;
      padding: 0 10px;
    }

    .house-result {
      font-family: 'Cinzel Decorative', cursive;
      font-size: 2.7rem;
      font-weight: 900;
      margin-top: 10px;
      opacity: 0;
      transform: scale(0.4);
      transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .house-result.show {
      opacity: 1;
      transform: scale(1.1);
    }

    .res-Gryffindor { color: var(--gryffindor); text-shadow: 0 0 30px rgba(230, 57, 70, 0.8); }
    .res-Hufflepuff { color: var(--hufflepuff); text-shadow: 0 0 30px rgba(255, 183, 3, 0.8); }
    .res-Ravenclaw { color: var(--ravenclaw); text-shadow: 0 0 30px rgba(58, 134, 255, 0.8); }
    .res-Slytherin { color: var(--slytherin); text-shadow: 0 0 30px rgba(46, 196, 182, 0.8); }

    .houses-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      width: 100%;
      max-width: 1050px;
      margin-top: 20px;
    }

    .house-card {
      background: rgba(13, 9, 23, 0.95);
      border-radius: 10px;
      padding: 12px;
      min-height: 200px;
      border-top: 4px solid #fff;
    }

    .card-Gryffindor { border-top-color: var(--gryffindor); }
    .card-Hufflepuff { border-top-color: var(--hufflepuff); }
    .card-Ravenclaw { border-top-color: var(--ravenclaw); }
    .card-Slytherin { border-top-color: var(--slytherin); }

    .house-card h3 {
      font-size: 1.05rem;
      text-align: center;
      margin-bottom: 8px;
    }

    .card-Gryffindor h3 { color: #ff7b88; }
    .card-Hufflepuff h3 { color: #ffd166; }
    .card-Ravenclaw h3 { color: #7cb3ff; }
    .card-Slytherin h3 { color: #64dfdf; }

    .house-card ul {
      list-style-type: none;
      font-size: 0.88rem;
      line-height: 1.5;
    }

    .house-card li {
      padding: 3px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
  </style>
</head>
<body>

  <h1>⚡ Zeremonie des Sprechenden Huts ⚡</h1>

  <!-- Status-Leiste zur Audio-Prüfung -->
  <div class="audio-status-panel">
    <div class="status-items" id="statusBox">
      <span>Audio-Dateien prüfen...</span>
    </div>
    <div>
      <input type="file" id="filePicker" multiple accept="audio/mp3,audio/*" style="display:none" onchange="handleManualFiles(this.files)">
      <button class="drop-btn" onclick="document.getElementById('filePicker').click()">📁 Alle MP3s direkt auswählen</button>
    </div>
  </div>

  <div class="container">
    <div class="card">
      <label for="nameList">Schülerliste (18 Namen):</label>
      <textarea id="nameList" placeholder="Harry Potter&#10;Hermine Granger&#10;Ron Weasley..."></textarea>

      <label for="singleName">Oder Einzelschüler:</label>
      <input type="text" id="singleName" placeholder="Name eingeben...">

      <button class="btn" id="sortBtn" onclick="startCeremony()">🧙‍♂️ Den Hut aufsetzen!</button>
    </div>

    <div class="card stage" id="stage">
      <div class="hat-icon">🧙‍♂️</div>
      <div class="student-name" id="studentDisplay">Tritt vor und nimm Platz...</div>
      <div class="speech-bubble" id="quoteDisplay"></div>
      <div class="house-result" id="resultDisplay"></div>
    </div>
  </div>

  <div class="houses-grid">
    <div class="house-card card-Gryffindor">
      <h3>Gryffindor (<span id="count-Gryffindor">0</span>/<span id="max-Gryffindor">?</span>)</h3>
      <ul id="list-Gryffindor"></ul>
    </div>
    <div class="house-card card-Hufflepuff">
      <h3>Hufflepuff (<span id="count-Hufflepuff">0</span>/<span id="max-Hufflepuff">?</span>)</h3>
      <ul id="list-Hufflepuff"></ul>
    </div>
    <div class="house-card card-Ravenclaw">
      <h3>Ravenclaw (<span id="count-Ravenclaw">0</span>/<span id="max-Ravenclaw">?</span>)</h3>
      <ul id="list-Ravenclaw"></ul>
    </div>
    <div class="house-card card-Slytherin">
      <h3>Slytherin (<span id="count-Slytherin">0</span>/<span id="max-Slytherin">?</span>)</h3>
      <ul id="list-Slytherin"></ul>
    </div>
  </div>

  <script>
    // 1. AUDIO REGISTER & DATEI-MAPPING
    const audioVault = {};
    const requiredFiles = [
      "call_gryffindor.mp3",
      "call_hufflepuff.mp3",
      "call_ravenclaw.mp3",
      "call_slytherin.mp3",
      "denken_gryffindor_1.mp3",
      "denken_gryffindor_2.mp3",
      "denken_hufflepuff_1.mp3",
      "denken_hufflepuff_2.mp3",
      "denken_ravenclaw_1.mp3",
      "denken_ravenclaw_2.mp3",
      "denken_slytherin_1.mp3",
      "denken_slytherin_2.mp3"
    ];

    function updateStatusUI() {
      const box = document.getElementById('statusBox');
      box.innerHTML = '';
      
      let missingCount = 0;
      requiredFiles.forEach(file => {
        const span = document.createElement('span');
        span.className = 'status-tag ' + (audioVault[file] ? 'tag-ok' : 'tag-missing');
        span.innerText = (audioVault[file] ? '✓ ' : '✗ ') + file;
        box.appendChild(span);
        if (!audioVault[file]) missingCount++;
      });

      if (missingCount > 0) {
        const hint = document.createElement('span');
        hint.style.color = '#ffd166';
        hint.innerText = `(${missingCount} fehlen. Klicke rechts auf "MP3s auswählen" falls lokale Pfade blockiert sind!)`;
        box.appendChild(hint);
      }
    }

    // Automatischer Ladeversuch aus dem Ordner
    requiredFiles.forEach(filename => {
      const audio = new Audio(filename);
      audio.oncanplaythrough = () => {
        audioVault[filename] = audio;
        updateStatusUI();
      };
      audio.onerror = () => {
        updateStatusUI();
      };
    });

    // Fallback: Dateien direkt per Klick/Drag&Drop laden (umgeht jede Browser-CORS-Sperre)
    function handleManualFiles(files) {
      Array.from(files).forEach(file => {
        const url = URL.createObjectURL(file);
        const audio = new Audio(url);
        // Dateinamen bereinigen für sauberen Match
        const matchName = file.name.toLowerCase();
        audioVault[matchName] = audio;
      });
      updateStatusUI();
    }

    // Drag and drop Support auf das gesamte Fenster
    window.addEventListener('dragover', (e) => e.preventDefault());
    window.addEventListener('drop', (e) => {
      e.preventDefault();
      if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
        handleManualFiles(e.dataTransfer.files);
      }
    });

    // 2. FESTE VERTEILUNG FÜR 18 SCHÜLER (5 + 5 + 4 + 4)
    const houses = ['Gryffindor', 'Hufflepuff', 'Ravenclaw', 'Slytherin'];
    const assigned = { Gryffindor: [], Hufflepuff: [], Ravenclaw: [], Slytherin: [] };

    const capacities = {};
    const shuffled = [...houses].sort(() => Math.random() - 0.5);
    capacities[shuffled[0]] = 5;
    capacities[shuffled[1]] = 5;
    capacities[shuffled[2]] = 4;
    capacities[shuffled[3]] = 4;

    houses.forEach(h => {
      document.getElementById(`max-${h}`).innerText = capacities[h];
    });

    const houseDialogues = {
      Gryffindor: [
        { text: "Hmm... ich spüre ein unerschrockenes Herz, Mut zur Tat und eiserne Tapferkeit!", file: "denken_gryffindor_1.mp3" },
        { text: "Hier lodert wahrer Heldenmut, Gerechtigkeitssinn und eine kühne Seele!", file: "denken_gryffindor_2.mp3" }
      ],
      Hufflepuff: [
        { text: "Ich sehe unerschütterliche Treue, Fleiß und eine grenzenlos gütige, ehrliche Seele.", file: "denken_hufflepuff_1.mp3" },
        { text: "Geduld, harter Einsatz und ein goldenes Herz... Loyalität steht hier an erster Stelle!", file: "denken_hufflepuff_2.mp3" }
      ],
      Ravenclaw: [
        { text: "Oh, was für ein messerscharfer Verstand! Wissensdrang und schöpferische Weisheit!", file: "denken_ravenclaw_1.mp3" },
        { text: "Ein tiefer Durst nach Erkenntnis, Logik und außergewöhnlicher Klugheit!", file: "denken_ravenclaw_2.mp3" }
      ],
      Slytherin: [
        { text: "Ich erkenne großen Ehrgeiz, Schläue, Führungsqualitäten und Entschlossenheit!", file: "denken_slytherin_1.mp3" },
        { text: "Ein strategischer Kopf, der genau weiß, wie er seine Ziele mit Stolz erreicht!", file: "denken_slytherin_2.mp3" }
      ]
    };

    function pickTargetHouse() {
      const open = houses.filter(h => assigned[h].length < capacities[h]);
      if (open.length === 0) return houses[Math.floor(Math.random() * houses.length)];
      return open[Math.floor(Math.random() * open.length)];
    }

    function playSoundAsync(filename) {
      return new Promise((resolve) => {
        let sound = audioVault[filename] || new Audio(filename);
        sound.currentTime = 0;

        let finished = false;
        const done = () => {
          if (!finished) {
            finished = true;
            resolve();
          }
        };

        sound.onended = done;
        sound.onerror = () => {
          console.warn("Datei konnte nicht abgespielt werden:", filename);
          setTimeout(done, 2000);
        };

        sound.play().catch(e => {
          console.warn("Autoplay/Ladefehler:", e);
          setTimeout(done, 2000);
        });
      });
    }

    // 3. ZEREMONIE
    async function startCeremony() {
      const singleInput = document.getElementById('singleName');
      const listInput = document.getElementById('nameList');
      let name = singleInput.value.trim();

      if (!name) {
        const lines = listInput.value.split('\n').map(l => l.trim()).filter(l => l.length > 0);
        if (lines.length > 0) {
          name = lines.shift();
          listInput.value = lines.join('\n');
        }
      } else {
        singleInput.value = '';
      }

      if (!name) {
        alert("Bitte gib einen Schülernamen ein oder fülle die Liste.");
        return;
      }

      const sortBtn = document.getElementById('sortBtn');
      const stage = document.getElementById('stage');
      const studentDisplay = document.getElementById('studentDisplay');
      const quoteDisplay = document.getElementById('quoteDisplay');
      const resultDisplay = document.getElementById('resultDisplay');

      sortBtn.disabled = true;
      resultDisplay.className = 'house-result';
      resultDisplay.innerText = '';
      studentDisplay.innerText = `${name} setzt den Sprechenden Hut auf...`;
      stage.classList.add('thinking');

      const targetHouse = pickTargetHouse();
      const options = houseDialogues[targetHouse];
      const selected = options[Math.floor(Math.random() * options.length)];

      quoteDisplay.innerText = `„${selected.text}“`;

      try {
        // 1. Denk-Audio abspielen
        await playSoundAsync(selected.file);

        // 2. Dramatische Pause
        await new Promise(r => setTimeout(r, 600));

        // 3. Haus zuweisen & anzeigen
        assigned[targetHouse].push(name);
        stage.classList.remove('thinking');
        resultDisplay.innerText = targetHouse.toUpperCase() + "!";
        resultDisplay.className = `house-result show res-${targetHouse}`;

        const ul = document.getElementById(`list-${targetHouse}`);
        const li = document.createElement('li');
        li.innerText = `${assigned[targetHouse].length}. ${name}`;
        ul.appendChild(li);
        document.getElementById(`count-${targetHouse}`).innerText = assigned[targetHouse].length;

        // 4. Hausruf abspielen
        await playSoundAsync(`call_${targetHouse.toLowerCase()}.mp3`);

      } catch (err) {
        console.error(err);
      } finally {
        sortBtn.disabled = false;
      }
    }
  </script>
</body>
</html>

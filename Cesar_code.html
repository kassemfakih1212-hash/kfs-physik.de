<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KFS - Cäsar Crypto Laboratory (Crisp & Clean)</title>
    <style>
        :root {
            --bg-color: #030712;
            --card-bg: #0b1329;
            --card-border: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #64748b;
            --accent-matrix: #10b981;
            --accent-green-glow: #34d399;
            --accent-blue: #38bdf8;
            --accent-gold: #fbbf24;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 20px;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            font-size: 1.5rem;
            color: var(--text-main);
            font-weight: 700;
        }

        .tab-nav {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab-btn {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-muted);
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.25s ease;
            flex: 1;
            text-align: center;
        }

        .tab-btn:hover {
            color: var(--text-main);
            border-color: var(--accent-blue);
        }

        .tab-btn.active {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.8), rgba(15, 23, 42, 0.9));
            color: var(--accent-gold);
            border-color: var(--accent-gold);
            box-shadow: 0 0 15px rgba(251, 191, 36, 0.15);
        }

        .grid-container {
            display: grid;
            grid-template-columns: 360px 1fr;
            gap: 20px;
        }

        @media (max-width: 950px) {
            .grid-container { grid-template-columns: 1fr; }
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 18px;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .card h2 {
            font-size: 1rem;
            margin-bottom: 14px;
            color: var(--accent-blue);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .control-group { margin-bottom: 14px; }

        label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        textarea, select, input[type="range"] {
            width: 100%;
            padding: 10px;
            background-color: rgba(3, 7, 18, 0.7);
            border: 1px solid var(--card-border);
            border-radius: 6px;
            color: var(--text-main);
            font-size: 0.85rem;
            font-family: "Cascadia Code", "Fira Code", monospace;
        }

        textarea:focus, select:focus {
            outline: none;
            border-color: var(--accent-blue);
        }

        textarea { height: 85px; resize: vertical; }

        input[type="range"] {
            padding: 4px 0;
            accent-color: var(--accent-gold);
            cursor: pointer;
        }

        .val-badge {
            font-weight: 700;
            color: var(--accent-gold);
            float: right;
            font-family: monospace;
            font-size: 0.95rem;
        }

        .btn-group {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        button {
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.85rem;
        }

        button:hover { opacity: 0.9; transform: translateY(-1px); }

        .btn-crack {
            background: linear-gradient(135deg, var(--accent-gold), #d97706);
            color: #000;
            flex: 1;
        }

        .anim-controls {
            display: flex;
            gap: 6px;
            margin-top: 8px;
        }

        .btn-anim {
            background-color: #1e293b;
            color: var(--text-main);
            flex: 1;
            font-size: 0.8rem;
            border: 1px solid var(--card-border);
        }
        .btn-anim.active {
            background-color: var(--accent-blue);
            color: #000;
            border-color: var(--accent-blue);
        }

        .step-btns {
            display: flex;
            gap: 6px;
            margin-top: 8px;
        }
        .btn-step {
            background-color: #334155;
            color: var(--text-main);
            flex: 1;
        }

        canvas {
            width: 100%;
            background-color: #02050e;
            border-radius: 8px;
            display: block;
        }

        #canvasSlider { height: 320px; }
        #canvasFreq { height: 180px; }

        .dual-output-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .output-box {
            background-color: rgba(3, 7, 18, 0.6);
            padding: 12px;
            border-radius: 6px;
            border: 1px solid var(--card-border);
        }

        .output-box .title {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 600;
            letter-spacing: 0.05em;
        }

        .output-box .value {
            font-size: 0.95rem;
            word-break: break-all;
            margin-top: 6px;
            font-family: "Cascadia Code", "Fira Code", monospace;
            line-height: 1.4;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .stat-card {
            background-color: rgba(3, 7, 18, 0.6);
            padding: 10px 6px;
            border-radius: 6px;
            border: 1px solid var(--card-border);
            text-align: center;
        }

        .stat-card .num {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--accent-gold);
            font-family: monospace;
        }

        .stat-card .lbl {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-top: 2px;
        }
    </style>
</head>
<body>

    <header>
        <h1>KFS - CÄSAR CRYPTO LABORATORY</h1>
        <div style="font-size: 0.85rem; color: var(--accent-gold); font-weight: 600;">
            MODUS: <span id="statusTxt">1. SENDER (VERSCHLÜSSELN)</span>
        </div>
    </header>

    <div class="tab-nav">
        <button class="tab-btn active" id="tabSender" onclick="switchMode('sender')">
            🔒 Modus 1: Sender (Verschlüsseln)
        </button>
        <button class="tab-btn" id="tabDetective" onclick="switchMode('detective')">
            🕵️ Modus 2: Detektiv (Code knacken)
        </button>
    </div>

    <div class="grid-container">
        <aside>
            <div class="card">
                <h2 id="panelTitle">Klartext-Eingabe</h2>

                <div class="control-group">
                    <label id="inputLabel">Gib deinen Nachrichtentext ein:</label>
                    <textarea id="inputText" oninput="processCrypto()"></textarea>
                </div>

                <div class="control-group" id="shiftControl">
                    <label>Cäsar-Schlüssel (Shift k): <span class="val-badge" id="shiftVal">3</span></label>
                    <input type="range" id="inputShift" min="0" max="25" value="3" oninput="processCrypto()">
                </div>

                <div class="control-group">
                    <label>Animations-Modus</label>
                    <div class="anim-controls">
                        <button class="btn-anim active" id="btnModeAuto" onclick="setAnimMode('auto')">Auto-Durchlauf</button>
                        <button class="btn-anim" id="btnModeStep" onclick="setAnimMode('step')">Manuell (Schritt)</button>
                    </div>

                    <div id="autoSpeedGroup" style="margin-top: 8px;">
                        <label>Geschwindigkeit: <span class="val-badge" id="speedVal">1.0x</span></label>
                        <input type="range" id="inputSpeed" min="0.2" max="3.0" step="0.2" value="1.0" oninput="updateSpeed()">
                    </div>

                    <div class="step-btns" id="stepControlGroup" style="display: none;">
                        <button class="btn-step" onclick="changeStep(-1)">◄ Zurück</button>
                        <button class="btn-step" onclick="changeStep(1)">Weiter ►</button>
                    </div>
                </div>

                <div class="control-group" id="langControl" style="display: none;">
                    <label>Referenzsprache für Frequenz-Match</label>
                    <select id="selectLang" onchange="processCrypto()">
                        <option value="de" selected>Deutsch (E = 17.4%, N = 9.8%)</option>
                        <option value="en">Englisch (E = 12.7%, T = 9.1%)</option>
                    </select>
                </div>

                <div class="btn-group" id="crackBtnGroup" style="display: none;">
                    <button class="btn-crack" onclick="autoCrack()">⚡ Auto-Crack (Geheimnis lüften)</button>
                </div>
            </div>

            <div class="card">
                <h2>Statistische Kennzahlen</h2>
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="num" id="statChars">0</div>
                        <div class="lbl">Buchstaben</div>
                    </div>
                    <div class="stat-card">
                        <div class="num" id="statEntropy">0.00</div>
                        <div class="lbl">Entropie</div>
                    </div>
                    <div class="stat-card">
                        <div class="num" id="statChi">0.0</div>
                        <div class="lbl">Chi² Abw.</div>
                    </div>
                </div>
            </div>
        </aside>

        <main>
            <div class="card">
                <h2>Textvergleich</h2>
                <div class="dual-output-grid">
                    <div class="output-box">
                        <div class="title" style="color: var(--accent-green-glow);">KLARTEXT</div>
                        <div class="value" id="valPlain" style="color: var(--accent-green-glow);">--</div>
                    </div>
                    <div class="output-box">
                        <div class="title" style="color: var(--accent-blue);">GEHEIMTEXT (CHIFFRAT)</div>
                        <div class="value" id="valCipher" style="color: var(--accent-blue);">--</div>
                    </div>
                </div>
            </div>

            <div class="card">
                <h2>Zyklische Schiebe-Rinne (Gestochen scharf & Neon-Leuchten)</h2>
                <canvas id="canvasSlider"></canvas>
            </div>

            <div class="card" id="freqCard" style="display: none;">
                <h2>Frequenzanalyse vs. Sprachprofil</h2>
                <canvas id="canvasFreq"></canvas>
            </div>
        </main>
    </div>

    <script>
        const GermanFreq = { A:6.5, B:1.9, C:3.1, D:5.1, E:17.4, F:1.7, G:3.0, H:4.8, I:7.6, J:0.3, K:1.2, L:3.4, M:2.5, N:9.8, O:2.5, P:0.8, Q:0.02, R:7.0, S:7.3, T:6.1, U:4.3, V:0.8, W:1.9, X:0.03, Y:0.04, Z:1.1 };
        const EnglishFreq = { A:8.2, B:1.5, C:2.8, D:4.3, E:12.7, F:2.2, G:2.0, H:6.1, I:7.0, J:0.15, K:0.8, L:4.0, M:2.4, N:6.7, O:7.5, P:1.9, Q:0.1, R:6.0, S:6.3, T:9.1, U:2.8, V:1.0, W:2.4, X:0.15, Y:2.0, Z:0.07 };

        let currentMode = 'sender';
        let animMode = 'auto';
        let isCracking = false;
        let crackInterval;
        
        let targetShift = 3;
        let currentShiftFloat = 3;
        let manualStepIndex = 0;
        let autoStepCounter = 0;

        const presetSender = "MATHEMATIK DER KRYPTOLOGIE IST FASZINIEREND";
        const presetDetective = "PDWKHPdWLN GHU NUBSWRORJLH LVW IDV]LQLHUHQG";

        const inputText = document.getElementById('inputText');
        const inputShift = document.getElementById('inputShift');
        const shiftVal = document.getElementById('shiftVal');
        const inputSpeed = document.getElementById('inputSpeed');
        const speedVal = document.getElementById('speedVal');
        const selectLang = document.getElementById('selectLang');
        const valPlain = document.getElementById('valPlain');
        const valCipher = document.getElementById('valCipher');
        const statusTxt = document.getElementById('statusTxt');

        const cvSlider = document.getElementById('canvasSlider');
        const cvFreq = document.getElementById('canvasFreq');
        const ctxSlider = cvSlider.getContext('2d');
        const ctxFreq = cvFreq.getContext('2d');

        // HiDPI / Retina Crispness Fix für gestochen scharfe Canvas-Schriften
        function setupCanvasResolution(canvas) {
            const dpr = window.devicePixelRatio || 1;
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            const ctx = canvas.getContext('2d');
            ctx.scale(dpr, dpr);
            return ctx;
        }

        function resizeCanvas() {
            [cvSlider, cvFreq].forEach(cv => {
                const dpr = window.devicePixelRatio || 1;
                const rect = cv.getBoundingClientRect();
                cv.width = rect.width * dpr;
                cv.height = rect.height * dpr;
            });
            drawAll();
        }
        window.addEventListener('resize', resizeCanvas);

        function switchMode(mode) {
            currentMode = mode;
            document.getElementById('tabSender').classList.toggle('active', mode === 'sender');
            document.getElementById('tabDetective').classList.toggle('active', mode === 'detective');

            if (mode === 'sender') {
                statusTxt.textContent = '1. SENDER (VERSCHLÜSSELN)';
                document.getElementById('panelTitle').textContent = 'Klartext-Sender';
                document.getElementById('inputLabel').textContent = 'Gib deinen Klartext ein:';
                inputText.value = presetSender;
                document.getElementById('langControl').style.display = 'none';
                document.getElementById('crackBtnGroup').style.display = 'none';
                document.getElementById('freqCard').style.display = 'none';
                inputShift.value = 3;
            } else {
                statusTxt.textContent = '2. DETEKTIV (CODE KNACKEN)';
                document.getElementById('panelTitle').textContent = 'Geheimtext-Abfänger';
                document.getElementById('inputLabel').textContent = 'Geheimer Abfang-Code:';
                inputText.value = presetDetective;
                document.getElementById('langControl').style.display = 'block';
                document.getElementById('crackBtnGroup').style.display = 'flex';
                document.getElementById('freqCard').style.display = 'block';
                inputShift.value = 0; 
            }
            processCrypto();
        }

        function setAnimMode(m) {
            animMode = m;
            document.getElementById('btnModeAuto').classList.toggle('active', m === 'auto');
            document.getElementById('btnModeStep').classList.toggle('active', m === 'step');
            document.getElementById('autoSpeedGroup').style.display = (m === 'auto') ? 'block' : 'none';
            document.getElementById('stepControlGroup').style.display = (m === 'step') ? 'flex' : 'none';
        }

        function updateSpeed() {
            speedVal.textContent = parseFloat(inputSpeed.value).toFixed(1) + 'x';
        }

        function changeStep(dir) {
            const textAlphaOnly = inputText.value.toUpperCase().replace(/[^A-Z]/g, '');
            if (textAlphaOnly.length === 0) return;
            manualStepIndex = (manualStepIndex + dir + textAlphaOnly.length) % textAlphaOnly.length;
            drawSliderCanvas();
        }

        function encryptCaesar(text, shift) {
            return text.toUpperCase().split('').map(ch => {
                const code = ch.charCodeAt(0);
                if (code >= 65 && code <= 90) {
                    return String.fromCharCode(((code - 65 + shift) % 26) + 65);
                }
                return ch;
            }).join('');
        }

        function decryptCaesar(text, shift) {
            return encryptCaesar(text, (26 - (shift % 26)) % 26);
        }

        function getCounts(text) {
            const counts = {};
            for (let i = 65; i <= 90; i++) counts[String.fromCharCode(i)] = 0;
            let total = 0;
            for (let ch of text.toUpperCase()) {
                if (ch >= 'A' && ch <= 'Z') {
                    counts[ch]++;
                    total++;
                }
            }
            return { counts, total };
        }

        function calcChiSquare(counts, total, langRef) {
            if (total === 0) return 0;
            let chi = 0;
            for (let i = 65; i <= 90; i++) {
                const letter = String.fromCharCode(i);
                const observed = counts[letter];
                const expected = (langRef[letter] / 100) * total;
                if (expected > 0) {
                    chi += Math.pow(observed - expected, 2) / expected;
                }
            }
            return chi;
        }

        function calcEntropy(counts, total) {
            if (total === 0) return 0;
            let ent = 0;
            for (let letter in counts) {
                const p = counts[letter] / total;
                if (p > 0) ent -= p * Math.log2(p);
            }
            return ent;
        }

        function processCrypto() {
            const shift = parseInt(inputShift.value);
            shiftVal.textContent = shift;
            targetShift = shift;

            let plain = '';
            let cipher = '';

            if (currentMode === 'sender') {
                plain = inputText.value.toUpperCase();
                cipher = encryptCaesar(plain, shift);
            } else {
                cipher = inputText.value.toUpperCase();
                plain = decryptCaesar(cipher, shift);
            }

            valPlain.textContent = plain || '--';
            valCipher.textContent = cipher || '--';

            const { counts, total } = getCounts(cipher);
            const langRef = selectLang.value === 'de' ? GermanFreq : EnglishFreq;
            const chi = calcChiSquare(counts, total, langRef);
            const ent = calcEntropy(counts, total);

            document.getElementById('statChars').textContent = total;
            document.getElementById('statEntropy').textContent = ent.toFixed(2);
            document.getElementById('statChi').textContent = chi.toFixed(1);

            drawAll();
        }

        function autoCrack() {
            if (isCracking) return;
            isCracking = true;
            statusTxt.textContent = 'CRACKING CODE...';
            statusTxt.style.color = 'var(--accent-gold)';

            let bestShift = 0;
            let minChi = Infinity;
            let testShift = 0;
            const text = inputText.value;
            const langRef = selectLang.value === 'de' ? GermanFreq : EnglishFreq;

            crackInterval = setInterval(() => {
                inputShift.value = testShift;
                processCrypto();

                const decryptedAttempt = decryptCaesar(text, testShift); 
                const { counts, total } = getCounts(decryptedAttempt);
                const chi = calcChiSquare(counts, total, langRef);

                if (chi < minChi) {
                    minChi = chi;
                    bestShift = testShift;
                }

                testShift++;
                if (testShift >= 26) {
                    clearInterval(crackInterval);
                    inputShift.value = bestShift;
                    processCrypto();
                    isCracking = false;
                    statusTxt.textContent = `GEKNACKT! BESTER SCHLÜSSEL k = ${bestShift}`;
                    statusTxt.style.color = 'var(--accent-green-glow)';
                }
            }, 90);
        }

        function drawAll() {
            drawSliderCanvas();
            if (currentMode === 'detective') drawFreqCanvas();
        }

        function drawSliderCanvas() {
            const width = cvSlider.clientWidth;
            const height = cvSlider.clientHeight;
            const dpr = window.devicePixelRatio || 1;
            
            if (cvSlider.width !== width * dpr) {
                cvSlider.width = width * dpr;
                cvSlider.height = height * dpr;
            }

            ctxSlider.save();
            ctxSlider.scale(dpr, dpr);
            ctxSlider.clearRect(0, 0, width, height);

            currentShiftFloat += (targetShift - currentShiftFloat) * 0.2;

            const paddingX = 25;
            const availableW = width - (paddingX * 2);
            const boxW = availableW / 26;

            const yTopRow = height * 0.32;
            const yBotRow = height * 0.68;

            ctxSlider.textAlign = 'center';
            ctxSlider.textBaseline = 'middle';

            ctxSlider.font = '600 11px sans-serif';
            ctxSlider.fillStyle = '#64748b';
            ctxSlider.textAlign = 'left';
            ctxSlider.fillText('OBERE LEISTE (Klartext Alphabet A - Z):', paddingX, yTopRow - 26);
            ctxSlider.fillText('UNTERE LEISTE (Geheim-Alphabet - zyklisch verschoben):', paddingX, yBotRow - 26);

            const textAlphaOnly = inputText.value.toUpperCase().replace(/[^A-Z]/g, '');
            let activePlainCode = -1;
            let activeCipherCode = -1;

            if (textAlphaOnly.length > 0) {
                if (animMode === 'auto') {
                    const speedMultiplier = parseFloat(inputSpeed.value) || 1.0;
                    autoStepCounter += 0.012 * speedMultiplier;
                    manualStepIndex = Math.floor(autoStepCounter) % textAlphaOnly.length;
                }

                const currentShiftInt = Math.round(currentShiftFloat);

                if (currentMode === 'sender') {
                    activePlainCode = textAlphaOnly[manualStepIndex].charCodeAt(0) - 65;
                    activeCipherCode = (activePlainCode + currentShiftInt) % 26;
                } else {
                    activeCipherCode = textAlphaOnly[manualStepIndex].charCodeAt(0) - 65;
                    activePlainCode = (activeCipherCode - currentShiftInt + 26) % 26;
                }
            }

            // OBERE REIHE (Klartext) - gestochen scharf mit sauberem Leuchten
            for (let i = 0; i < 26; i++) {
                const x = Math.round(paddingX + i * boxW + boxW / 2);
                const letter = String.fromCharCode(65 + i);
                const isActive = (i === activePlainCode);

                ctxSlider.fillStyle = isActive ? 'rgba(251, 191, 36, 0.2)' : 'rgba(15, 23, 42, 0.85)';
                ctxSlider.strokeStyle = isActive ? '#fbbf24' : '#1e293b';
                ctxSlider.lineWidth = isActive ? 2 : 1;

                ctxSlider.fillRect(Math.round(x - boxW / 2 + 1), Math.round(yTopRow - 17), Math.round(boxW - 2), 34);
                ctxSlider.strokeRect(Math.round(x - boxW / 2 + 1), Math.round(yTopRow - 17), Math.round(boxW - 2), 34);

                if (isActive) {
                    ctxSlider.shadowColor = '#fbbf24';
                    ctxSlider.shadowBlur = 10;
                } else {
                    ctxSlider.shadowBlur = 0;
                }

                ctxSlider.fillStyle = isActive ? '#fbbf24' : '#f8fafc';
                ctxSlider.font = `700 15px "Cascadia Code", monospace`;
                ctxSlider.fillText(letter, x, yTopRow);
                ctxSlider.shadowBlur = 0;
            }

            // UNTERE REIHE (Geheimtext) - gestochen scharf mit sauberem Leuchten
            const currentShiftInt = Math.round(currentShiftFloat);

            for (let i = 0; i < 26; i++) {
                const alphabetIndex = (i + currentShiftInt) % 26;
                const letter = String.fromCharCode(65 + alphabetIndex);

                const x = Math.round(paddingX + i * boxW + boxW / 2);
                const isActive = (alphabetIndex === activeCipherCode);

                ctxSlider.fillStyle = isActive ? 'rgba(251, 191, 36, 0.2)' : 'rgba(15, 23, 42, 0.85)';
                ctxSlider.strokeStyle = isActive ? '#fbbf24' : '#1e293b';
                ctxSlider.lineWidth = isActive ? 2 : 1;

                ctxSlider.fillRect(Math.round(x - boxW / 2 + 1), Math.round(yBotRow - 17), Math.round(boxW - 2), 34);
                ctxSlider.strokeRect(Math.round(x - boxW / 2 + 1), Math.round(yBotRow - 17), Math.round(boxW - 2), 34);

                if (isActive) {
                    ctxSlider.shadowColor = '#fbbf24';
                    ctxSlider.shadowBlur = 10;
                } else {
                    ctxSlider.shadowBlur = 0;
                }

                ctxSlider.fillStyle = isActive ? '#fbbf24' : '#94a3b8';
                ctxSlider.font = `700 15px "Cascadia Code", monospace`;
                ctxSlider.fillText(letter, x, yBotRow);
                ctxSlider.shadowBlur = 0;
            }

            ctxSlider.restore();
        }

        function drawFreqCanvas() {
            const width = cvFreq.clientWidth;
            const height = cvFreq.clientHeight;
            const dpr = window.devicePixelRatio || 1;

            if (cvFreq.width !== width * dpr) {
                cvFreq.width = width * dpr;
                cvFreq.height = height * dpr;
            }

            const ctx = cvFreq.getContext('2d');
            ctx.save();
            ctx.scale(dpr, dpr);
            ctx.clearRect(0, 0, width, height);

            const marginB = 25;
            const marginL = 30;
            const drawW = width - marginL - 10;
            const drawH = height - marginB - 10;

            const shift = parseInt(inputShift.value);
            const decrypted = decryptCaesar(inputText.value, shift);
            const { counts, total } = getCounts(decrypted);
            const langRef = selectLang.value === 'de' ? GermanFreq : EnglishFreq;

            const barW = drawW / 26;

            for (let i = 0; i < 26; i++) {
                const letter = String.fromCharCode(65 + i);
                const obsPct = total > 0 ? (counts[letter] / total) * 100 : 0;
                const expPct = langRef[letter];

                const x = marginL + i * barW;

                const expH = (expPct / 20) * drawH;
                ctx.fillStyle = 'rgba(251, 191, 36, 0.2)';
                ctx.fillRect(Math.round(x + 1), Math.round(height - marginB - expH), Math.round(barW - 2), expH);

                const obsH = Math.min(drawH, (obsPct / 20) * drawH);
                ctx.fillStyle = '#34d399';
                ctx.fillRect(Math.round(x + 2), Math.round(height - marginB - obsH), Math.round(barW - 4), obsH);

                ctx.fillStyle = '#64748b';
                ctx.font = '10px monospace';
                ctx.textAlign = 'center';
                ctx.fillText(letter, x + barW / 2, height - 8);
            }
            ctx.restore();
        }

        function drawAll() {
            drawSliderCanvas();
            if (currentMode === 'detective') drawFreqCanvas();
        }

        setInterval(() => { drawSliderCanvas(); }, 30);
        switchMode('sender');
    </script>
</body>
</html>
